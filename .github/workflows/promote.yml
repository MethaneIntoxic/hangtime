name: Deploy production

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character main-branch commit SHA that passed preview
        required: true
        type: string
      preview_url:
        description: Trusted preview URL that passed smoke testing
        required: true
        type: string

concurrency:
  group: hangtime-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - name: Validate immutable promotion inputs
        id: inputs
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.source_sha }}
          INPUT_PREVIEW_URL: ${{ inputs.preview_url }}
        run: |
          [[ "$INPUT_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "source_sha must be a full lowercase SHA" >&2; exit 1; }
          [[ "$INPUT_PREVIEW_URL" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app/?$ ]] || {
            echo "preview_url must be a Vercel HTTPS deployment" >&2; exit 1;
          }
          echo "sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"
          echo "preview_url=${INPUT_PREVIEW_URL%/}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.inputs.outputs.sha }}
          fetch-depth: 0
      - name: Prove source is on protected main
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.inputs.outputs.sha }}
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "source_sha is not on main" >&2; exit 1;
          }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recheck trusted preview revision
        env:
          SOURCE_SHA: ${{ steps.inputs.outputs.sha }}
          PREVIEW_URL: ${{ steps.inputs.outputs.preview_url }}
        run: node scripts/smoke.mjs "$PREVIEW_URL" "$SOURCE_SHA"
      - name: Apply backward-compatible production migrations
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_PRODUCTION_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_PRODUCTION_AUTH_TOKEN }}
          LOCATION_KEYRING_B64: ${{ secrets.LOCATION_PRODUCTION_KEYRING_B64 }}
        run: pnpm db:migrate:turso
      - name: Validate production configuration contract
        env:
          NODE_ENV: production
          RELEASE_CHANNEL: production
          HANGTIME_DEMO_MODE: "false"
          TURSO_DATABASE_URL: ${{ secrets.TURSO_PRODUCTION_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_PRODUCTION_AUTH_TOKEN }}
          APP_URL: ${{ vars.PRODUCTION_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_EMAIL_DRIVER: resend
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
          LOCATION_KEYRING_B64: ${{ secrets.LOCATION_PRODUCTION_KEYRING_B64 }}
        run: pnpm check:production-env
      - name: Build staged production deployment
        env:
          SOURCE_SHA: ${{ steps.inputs.outputs.sha }}
        run: |
          pnpm dlx vercel@59.1.4 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          APP_REVISION="$SOURCE_SHA" pnpm dlx vercel@59.1.4 build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy without changing the production domain
        id: staged
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.inputs.outputs.sha }}
        run: |
          url="$(pnpm dlx vercel@59.1.4 deploy --prebuilt --prod --skip-domain --token="${{ secrets.VERCEL_TOKEN }}" --env APP_REVISION="$SOURCE_SHA")"
          [[ "$url" == https://* ]] || { echo "Vercel did not return an HTTPS URL" >&2; exit 1; }
          node scripts/smoke.mjs "$url" "$SOURCE_SHA"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Promote the exact smoke-tested deployment
        env:
          SOURCE_SHA: ${{ steps.inputs.outputs.sha }}
          STAGED_URL: ${{ steps.staged.outputs.url }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          pnpm dlx vercel@59.1.4 promote "$STAGED_URL" --yes --token="${{ secrets.VERCEL_TOKEN }}"
          node scripts/smoke.mjs "$PRODUCTION_URL" "$SOURCE_SHA"
          echo "### Production release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Staged and verified: $STAGED_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production: $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
