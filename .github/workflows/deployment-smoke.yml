name: Production availability smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.10.0
      - name: Verify production remains healthy
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          [[ "$PRODUCTION_URL" == https://* ]] || { echo "PRODUCTION_URL is not configured" >&2; exit 1; }
          node scripts/smoke.mjs "$PRODUCTION_URL"
