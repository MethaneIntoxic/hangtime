name: Production availability smoke

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.10.0
      - name: Verify production remains healthy
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          [[ "$PRODUCTION_URL" == https://* ]] || { echo "PRODUCTION_URL is not configured" >&2; exit 1; }
          node scripts/smoke.mjs "$PRODUCTION_URL"
