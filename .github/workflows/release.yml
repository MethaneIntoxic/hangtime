name: Deploy trusted preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: vercel-preview-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    if: >-
      vars.FREE_TIER_DEPLOYMENTS_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate exact source metadata
        env:
          SOURCE_SHA: ${{ env.RELEASE_SHA }}
          RELEASE_CHANNEL: preview
        run: pnpm release:metadata
      - name: Require isolated preview credentials
        shell: bash
        env:
          VERCEL_TOKEN_VALUE: ${{ secrets.VERCEL_TOKEN }}
          TURSO_URL: ${{ secrets.TURSO_PREVIEW_DATABASE_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_PREVIEW_AUTH_TOKEN }}
          LOCATION_KEYS: ${{ secrets.LOCATION_PREVIEW_KEYRING_B64 }}
        run: |
          [[ -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" && -n "$VERCEL_TOKEN_VALUE" ]] || {
            echo "Vercel project credentials are incomplete" >&2; exit 1;
          }
          [[ "$TURSO_URL" == libsql://* || "$TURSO_URL" == https://* ]] || {
            echo "TURSO_PREVIEW_DATABASE_URL is invalid" >&2; exit 1;
          }
          [[ -n "$TURSO_TOKEN" && -n "$LOCATION_KEYS" ]] || {
            echo "Preview database or encryption credentials are incomplete" >&2; exit 1;
          }
      - name: Apply backward-compatible preview migrations
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_PREVIEW_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_PREVIEW_AUTH_TOKEN }}
          LOCATION_KEYRING_B64: ${{ secrets.LOCATION_PREVIEW_KEYRING_B64 }}
        run: pnpm db:migrate:turso
      - name: Build exact source with Vercel preview configuration
        run: |
          pnpm dlx vercel@59.1.4 pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
          APP_REVISION="$RELEASE_SHA" pnpm dlx vercel@59.1.4 build --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy and smoke exact preview
        id: deploy
        shell: bash
        run: |
          url="$(pnpm dlx vercel@59.1.4 deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}" --env APP_REVISION="$RELEASE_SHA")"
          [[ "$url" == https://* ]] || { echo "Vercel did not return an HTTPS URL" >&2; exit 1; }
          node scripts/smoke.mjs "$url" "$RELEASE_SHA"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Trusted preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Record immutable preview release metadata
        env:
          SOURCE_SHA: ${{ env.RELEASE_SHA }}
          RELEASE_CHANNEL: preview
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm release:metadata
