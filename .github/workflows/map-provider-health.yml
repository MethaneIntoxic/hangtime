name: Map provider health

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hangtime-map-provider-health
  cancel-in-progress: true

jobs:
  openfreemap:
    if: vars.HOSTED_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.10.0
      - run: node scripts/check-map-provider.mjs
