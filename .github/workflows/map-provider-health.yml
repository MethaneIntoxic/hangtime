name: Map provider health

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hangtime-map-provider-health
  cancel-in-progress: true

jobs:
  openfreemap:
    if: vars.HOSTED_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0
      - run: node scripts/check-map-provider.mjs
