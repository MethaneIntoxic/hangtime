name: Roll back production code

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Previously verified Vercel production deployment URL
        required: true
        type: string
      expected_sha:
        description: Full source SHA served by that deployment
        required: true
        type: string
      database_compatible:
        description: Confirm the current Turso schema is backward-compatible with this code
        required: true
        type: boolean
      confirm_free_tier:
        description: Confirm this rollback is intentionally using the configured free-tier accounts
        required: true
        default: false
        type: boolean

concurrency:
  group: hangtime-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    if: inputs.database_compatible == true && inputs.confirm_free_tier == true && vars.FREE_TIER_DEPLOYMENTS_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.expected_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate exact rollback metadata
        env:
          SOURCE_SHA: ${{ inputs.expected_sha }}
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: pnpm release:metadata
      - name: Validate rollback target and revision
        shell: bash
        env:
          TARGET_URL: ${{ inputs.deployment_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "expected_sha is invalid" >&2; exit 1; }
          [[ "$TARGET_URL" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app/?$ ]] || {
            echo "deployment_url must be a Vercel HTTPS deployment" >&2; exit 1;
          }
          node scripts/smoke.mjs "${TARGET_URL%/}" "$EXPECTED_SHA"
      - name: Roll production alias back to verified deployment
        env:
          TARGET_URL: ${{ inputs.deployment_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          pnpm dlx vercel@59.1.4 rollback "${TARGET_URL%/}" --yes --token="${{ secrets.VERCEL_TOKEN }}"
          node scripts/smoke.mjs "$PRODUCTION_URL" "$EXPECTED_SHA"
